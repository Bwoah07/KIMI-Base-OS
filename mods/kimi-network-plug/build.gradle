plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
        content { includeGroup("top.theillusivec4.curios") }
    }
}

dependencies {
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-common-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-core-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-forge-api:1.120.2")
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// GitHub's contents API is text-only, so the build creates the bespoke binary
// PowerNet texture sheet deterministically. These are purpose-made KIMI textures,
// not recoloured vanilla block assets.
var generateKimiTextures = tasks.register('generateKimiTextures') {
    def outDir = layout.buildDirectory.dir('generated/kimiTextures/assets/kimi_network_plug/textures/block')
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        final int SIZE = 32

        def clamp = { int v -> Math.max(0, Math.min(255, v)) }
        def argb = { int r, int g, int b ->
            (255 << 24) | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b)
        }
        def writeTexture = { String name, Closure<Integer> pixel ->
            def image = new java.awt.image.BufferedImage(SIZE, SIZE, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < SIZE; y++) {
                for (int x = 0; x < SIZE; x++) image.setRGB(x, y, pixel(x, y))
            }
            javax.imageio.ImageIO.write(image, 'png', new File(dir, name + '.png'))
        }

        writeTexture('graphite_shell') { int x, int y ->
            int noise = ((x * 19 + y * 37 + x * y * 3) % 7) - 3
            int vertical = (14 - y).intdiv(6)
            int edge = (x < 2 || y < 2) ? 6 : ((x > 29 || y > 29) ? -7 : 0)
            int seam = (y == 8 || y == 23) ? -7 : 0
            argb(43 + noise + vertical + edge + seam,
                 48 + noise + vertical + edge + seam,
                 56 + noise + vertical + edge + seam)
        }

        writeTexture('front_plate') { int x, int y ->
            int noise = ((x * 11 + y * 23) % 5) - 2
            boolean rim = x == 2 || y == 2 || x == 29 || y == 29
            boolean inner = x == 6 || y == 6 || x == 25 || y == 25
            int lift = rim ? 13 : (inner ? 4 : 0)
            argb(24 + noise + lift, 29 + noise + lift, 35 + noise + lift)
        }

        writeTexture('metal_brushed') { int x, int y ->
            int streak = ((x * 7 + y * 3) % 9) - 4
            int brush = (y % 4 == 0) ? 6 : 0
            int bevel = (x < 2 || y < 2) ? 15 : ((x > 29 || y > 29) ? -12 : 0)
            argb(119 + streak + brush + bevel,
                 130 + streak + brush + bevel,
                 142 + streak + brush + bevel)
        }

        def glowTexture = { String name, int r, int g, int b ->
            writeTexture(name) { int x, int y ->
                int dx = Math.abs(x - 15)
                int dy = Math.abs(y - 15)
                int falloff = Math.min(18, (dx + dy).intdiv(2))
                int stripe = ((x + y) % 8 == 0) ? 14 : 0
                int rim = (x < 2 || y < 2 || x > 29 || y > 29) ? -28 : 0
                argb(r - falloff + stripe + rim,
                     g - falloff + stripe + rim,
                     b - falloff + stripe + rim)
            }
        }
        glowTexture('status_green', 76, 226, 125)
        glowTexture('status_orange', 255, 151, 42)
        glowTexture('status_cyan', 55, 210, 225)
        glowTexture('status_gray', 137, 146, 157)

        writeTexture('tech_panel') { int x, int y ->
            int noise = ((x * 13 + y * 17) % 5) - 2
            boolean ring = (x == 4 || y == 4 || x == 27 || y == 27)
            int edge = ring ? 9 : 0
            int center = (x >= 9 && x <= 22 && y >= 9 && y <= 22) ? -4 : 0
            argb(31 + noise + edge + center,
                 37 + noise + edge + center,
                 44 + noise + edge + center)
        }
    }
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/kimiTextures')
processResources.dependsOn generateKimiTextures
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateKimiTextures

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
