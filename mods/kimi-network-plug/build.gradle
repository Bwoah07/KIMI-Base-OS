plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
        content { includeGroup("top.theillusivec4.curios") }
    }
}

dependencies {
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-common-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-core-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-forge-api:1.120.2")
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// The repository edits are text-only, so the build deterministically generates
// the PowerNet PNG assets. Alpha.12 moves to 64px, low-frequency materials: no
// per-pixel noise/dither, which keeps the hardware much smoother in-game while
// preserving a deliberately authored KIMI graphite/metal visual language.
var generateKimiTextures = tasks.register('generateKimiTextures') {
    def outDir = layout.buildDirectory.dir('generated/kimiTextures/assets/kimi_network_plug/textures/block')
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        final int SIZE = 64

        def clamp = { int v -> v < 0 ? 0 : (v > 255 ? 255 : v) }
        def argb = { int r, int g, int b ->
            (255 << 24) | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b)
        }
        def writeTexture = { String name, Closure<Integer> pixel ->
            def image = new java.awt.image.BufferedImage(SIZE, SIZE, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < SIZE; y++) {
                for (int x = 0; x < SIZE; x++) image.setRGB(x, y, pixel(x, y))
            }
            javax.imageio.ImageIO.write(image, 'png', new File(dir, name + '.png'))
        }

        writeTexture('graphite_shell') { int x, int y ->
            int vertical = (int) Math.round(4.0 - (y * 8.0 / (SIZE - 1)))
            int wave = (int) Math.round(Math.sin(x * 0.16) * 1.5 + Math.cos(y * 0.11) * 1.5)
            int bevel = (x < 3 || y < 3) ? 7 : ((x > 60 || y > 60) ? -6 : 0)
            int seam = (y == 16 || y == 47) ? -5 : 0
            int channel = (x == 20 || x == 43) ? -2 : 0
            int delta = vertical + wave + bevel + seam + channel
            argb(45 + delta, 50 + delta, 58 + delta)
        }

        writeTexture('front_plate') { int x, int y ->
            double dx = (x - 31.5) / 31.5
            double dy = (y - 31.5) / 31.5
            int centerShade = (int) Math.round(-4.0 * Math.max(0.0, 1.0 - Math.sqrt(dx * dx + dy * dy)))
            boolean outerRim = x == 4 || y == 4 || x == 59 || y == 59
            boolean innerRim = x == 11 || y == 11 || x == 52 || y == 52
            int rim = outerRim ? 15 : (innerRim ? 5 : 0)
            int wave = (int) Math.round(Math.sin((x + y) * 0.09) * 1.2)
            int delta = centerShade + rim + wave
            argb(26 + delta, 31 + delta, 38 + delta)
        }

        writeTexture('metal_brushed') { int x, int y ->
            int longWave = (int) Math.round(Math.sin(x * 0.10) * 3.0 + Math.cos(y * 0.07) * 2.0)
            int brush = (y % 8 == 0) ? 3 : 0
            int bevel = (x < 3 || y < 3) ? 13 : ((x > 60 || y > 60) ? -10 : 0)
            int delta = longWave + brush + bevel
            argb(122 + delta, 133 + delta, 145 + delta)
        }

        def glowTexture = { String name, int r, int g, int b ->
            writeTexture(name) { int x, int y ->
                double dx = x - 31.5
                double dy = y - 31.5
                double dist = Math.sqrt(dx * dx + dy * dy) / 44.5
                int falloff = (int) Math.round(Math.min(18.0, dist * 18.0))
                int edge = (x < 3 || y < 3 || x > 60 || y > 60) ? -18 : 0
                int soft = (int) Math.round(Math.sin((x + y) * 0.08) * 1.5)
                argb(r - falloff + edge + soft,
                     g - falloff + edge + soft,
                     b - falloff + edge + soft)
            }
        }
        glowTexture('status_green', 78, 226, 126)
        glowTexture('status_orange', 255, 154, 45)
        glowTexture('status_cyan', 60, 207, 222)
        glowTexture('status_gray', 139, 148, 158)

        writeTexture('tech_panel') { int x, int y ->
            int broad = (int) Math.round(Math.sin(x * 0.08) * 1.5 + Math.cos(y * 0.10) * 1.5)
            boolean rim = x == 7 || y == 7 || x == 56 || y == 56
            boolean inset = x == 15 || y == 15 || x == 48 || y == 48
            int detail = rim ? 10 : (inset ? 3 : 0)
            int center = (x >= 18 && x <= 45 && y >= 18 && y <= 45) ? -3 : 0
            int delta = broad + detail + center
            argb(30 + delta, 36 + delta, 43 + delta)
        }
    }
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/kimiTextures')
processResources.dependsOn generateKimiTextures
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateKimiTextures

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
