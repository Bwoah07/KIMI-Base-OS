plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        url = "https://maven.squiddev.cc"
        content { includeGroup("cc.tweaked") }
    }
    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
        content { includeGroup("top.theillusivec4.curios") }
    }
}

dependencies {
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-common-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-core-api:1.120.2")
    compileOnly("cc.tweaked:cc-tweaked-1.21.1-forge-api:1.120.2")
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
}

neoForge {
    version = project.neo_version

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

// GitHub's contents API is text-only, so the build creates deterministic binary
// PowerNet textures. The patterns are purpose-made for KIMI hardware and avoid
// vanilla Minecraft block textures entirely.
var generateKimiTextures = tasks.register('generateKimiTextures') {
    def outDir = layout.buildDirectory.dir('generated/kimiTextures/assets/kimi_network_plug/textures/block')
    outputs.dir(outDir)
    doLast {
        def dir = outDir.get().asFile
        dir.mkdirs()
        final int SIZE = 32

        def clamp = { int v -> v < 0 ? 0 : (v > 255 ? 255 : v) }
        def argb = { int r, int g, int b ->
            (255 << 24) | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b)
        }
        def writeTexture = { String name, Closure<Integer> pixel ->
            def image = new java.awt.image.BufferedImage(SIZE, SIZE, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < SIZE; y++) {
                for (int x = 0; x < SIZE; x++) {
                    image.setRGB(x, y, pixel(x, y))
                }
            }
            javax.imageio.ImageIO.write(image, 'png', new File(dir, name + '.png'))
        }

        // Layered graphite shell: bevels, panel seams and tiny hardware points.
        writeTexture('graphite_shell') { int x, int y ->
            int grain = ((x * 17 + y * 29 + x * y * 5) % 7) - 3
            int base = 48 + grain
            if (x <= 1 || y <= 1) base += 11
            if (x >= 30 || y >= 30) base -= 10
            if (y == 8 || y == 23) base -= 8
            if (x == 15 || x == 16) base -= 2
            boolean screw = (x == 4 || x == 27) && (y == 4 || y == 27)
            if (screw) base += 18
            argb(base - 3, base + 1, base + 8)
        }

        // Recessed front face with a double rim and subtle center panel.
        writeTexture('front_plate') { int x, int y ->
            int grain = ((x * 13 + y * 19) % 5) - 2
            int base = 28 + grain
            boolean outer = x == 2 || y == 2 || x == 29 || y == 29
            boolean inner = x == 5 || y == 5 || x == 26 || y == 26
            boolean center = x >= 8 && x <= 23 && y >= 8 && y <= 23
            if (outer) base += 18
            else if (inner) base += 7
            else if (center) base -= 5
            if ((x == 10 || x == 21) && y >= 13 && y <= 18) base += 5
            argb(base, base + 4, base + 9)
        }

        // Brushed alloy: horizontal micro-streaks, hard bevel and darker panel split.
        writeTexture('metal_brushed') { int x, int y ->
            int streak = ((x * 5 + y * 11) % 9) - 4
            int base = 132 + streak
            if (y % 4 == 0) base += 6
            if (x <= 1 || y <= 1) base += 20
            if (x >= 30 || y >= 30) base -= 18
            if (y == 15 || y == 16) base -= 8
            argb(base - 8, base, base + 10)
        }

        def glowTexture = { String name, int r, int g, int b ->
            writeTexture(name) { int x, int y ->
                int edge = (x <= 1 || y <= 1 || x >= 30 || y >= 30) ? -38 : 0
                int pulse = ((x + y) % 7 == 0) ? 10 : 0
                int center = (x >= 7 && x <= 24 && y >= 7 && y <= 24) ? 8 : 0
                argb(r + edge + pulse + center,
                     g + edge + pulse + center,
                     b + edge + pulse + center)
            }
        }
        glowTexture('status_green', 52, 184, 102)
        glowTexture('status_orange', 224, 118, 28)
        glowTexture('status_cyan', 38, 172, 194)
        glowTexture('status_gray', 102, 111, 122)

        // Shared inset tech surface for charger/chunk-loader top panels.
        writeTexture('tech_panel') { int x, int y ->
            int grain = ((x * 23 + y * 7) % 5) - 2
            int base = 34 + grain
            boolean rim = x == 3 || y == 3 || x == 28 || y == 28
            boolean inner = x == 7 || y == 7 || x == 24 || y == 24
            if (rim) base += 12
            if (inner) base += 5
            if (x >= 10 && x <= 21 && y >= 10 && y <= 21) base -= 4
            if ((x == 15 || x == 16) && y >= 11 && y <= 20) base += 4
            argb(base - 2, base + 3, base + 9)
        }
    }
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/kimiTextures')
processResources.dependsOn generateKimiTextures
neoForge.ideSyncTask generateModMetadata
neoForge.ideSyncTask generateKimiTextures

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
