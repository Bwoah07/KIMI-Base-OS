name: KIMI Lua OS Checks

on:
  push:
    branches:
      - main
      - feature/auto-display-overhaul
    paths:
      - '**/*.lua'
      - 'manifest.json'
      - 'version.txt'
      - '.github/workflows/lua-os-checks.yml'
  pull_request:
    branches:
      - main

jobs:
  lua-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Syntax check Lua files
        run: |
          find . -name '*.lua' -not -path './mods/*' -print0 | xargs -0 -n1 luac5.2 -p

      - name: Alpha37 compatibility regression test
        run: lua5.2 tests/alpha37_lockin_smoke.lua

      - name: Alpha38 lock-in regression test
        run: lua5.2 tests/alpha38_lockin_smoke.lua

      - name: Alpha39 room renderer regression test
        run: lua5.2 tests/alpha39_room_smoke.lua

      - name: Alpha40 lock-in regression test
        run: lua5.2 tests/alpha40_lockin_smoke.lua

      - name: Alpha41 profile/sensor regression test
        run: lua5.2 tests/alpha41_profile_sensor_smoke.lua

      - name: Alpha42 crash-proof room regression test
        run: lua5.2 tests/alpha42_room_crashproof_smoke.lua

      - name: Alpha43 installer/profile stability test
        run: lua5.2 tests/alpha43_stability_smoke.lua

      - name: Alpha44 monitor-touch redstone test
        run: lua5.2 tests/alpha44_touch_door_smoke.lua

      - name: Alpha45 peripheral.call door test
        run: lua5.2 tests/alpha45_door_peripheral_call_smoke.lua

      - name: Alpha46 pocket remote/juice test
        run: lua5.2 tests/alpha46_pocket_remote_smoke.lua

      - name: Alpha47 CC/redstone propagation test
        run: lua5.2 tests/alpha47_cc_unpack_door_smoke.lua

      - name: Alpha48 direct room redstone test
        run: lua5.2 tests/alpha48_direct_room_redstone_smoke.lua

      - name: Alpha49 saved-kind redstone fastpath test
        run: lua5.2 tests/alpha49_saved_kind_fastpath_smoke.lua

      - name: Alpha50 configured-door dispatch test
        run: lua5.2 tests/alpha50_configured_door_dispatch_smoke.lua

      - name: Alpha51 invert option test
        run: lua5.2 tests/alpha51_invert_option_smoke.lua

      - name: Alpha52 setup wizard test
        run: lua5.2 tests/alpha52_setup_wizard_smoke.lua

      - name: Alpha53 explicit output-side setup test
        run: lua5.2 tests/alpha53_explicit_side_setup_smoke.lua

      - name: Alpha54 inverted toggle test
        run: lua5.2 tests/alpha54_inverted_toggle_smoke.lua

      - name: Alpha55 clean room weather test
        run: lua5.2 tests/alpha55_room_weather_smoke.lua

      - name: Validate managed manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('manifest.json').read_text())
          missing = [p for p in manifest['managed'] if not Path(p).is_file()]
          if missing:
              raise SystemExit('managed files missing: ' + ', '.join(missing))

          version = Path('version.txt').read_text().strip()
          if version != manifest['version']:
              raise SystemExit(f'version mismatch: version.txt={version!r} manifest={manifest["version"]!r}')

          if len(manifest['managed']) != len(set(manifest['managed'])):
              raise SystemExit('manifest contains duplicate managed paths')
          if set(manifest.get('managed', ())) & set(manifest.get('remove', ())):
              raise SystemExit('a path is both managed and removed')

          profiles = ['terminal', 'admin', 'wall', 'pocket']
          for profile in profiles:
              path = Path('clients') / f'{profile}.lua'
              if not path.is_file():
                  raise SystemExit(f'installer profile file missing: {path}')
              if str(path).replace('\\','/') not in manifest['managed']:
                  raise SystemExit(f'installer profile not managed: {path}')

          print('manifest OK:', manifest['version'], len(manifest['managed']), 'managed files')
          PY
