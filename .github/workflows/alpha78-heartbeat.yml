name: KIMI Alpha78 Heartbeat

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'roles/client_v8.lua'
      - 'roles/node_v5.lua'
      - 'roles/server_v6.lua'
      - 'roles/server_v7.lua'
      - 'kimi.lua'
      - 'tests/alpha78_real_fleet_heartbeat_smoke.lua'
      - '.github/workflows/alpha78-heartbeat.yml'

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Syntax check heartbeat runtime
        run: |
          luac5.2 -p roles/client_v8.lua
          luac5.2 -p roles/node_v5.lua
          luac5.2 -p roles/server_v6.lua
          luac5.2 -p roles/server_v7.lua
          luac5.2 -p tests/alpha78_real_fleet_heartbeat_smoke.lua
      - name: Alpha78 real fleet heartbeat test
        run: lua5.2 tests/alpha78_real_fleet_heartbeat_smoke.lua
