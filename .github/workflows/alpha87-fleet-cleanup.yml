name: Alpha87 Fleet Cleanup Checks

on:
  push:
    branches:
      - feature/alpha87-fleet-cleanup-logical-ids
    paths:
      - '**/*.lua'
      - 'manifest.json'
      - 'version.txt'
      - '.github/workflows/alpha87-fleet-cleanup.yml'
  pull_request:
    branches:
      - main

jobs:
  alpha87-fleet-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.2
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2

      - name: Syntax check Lua files
        run: find . -name '*.lua' -not -path './mods/*' -print0 | xargs -0 -n1 luac5.2 -p

      - name: Alpha87 fleet cleanup regression test
        run: lua5.2 tests/alpha87_fleet_cleanup_smoke.lua
